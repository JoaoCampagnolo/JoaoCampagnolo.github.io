<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Jitterpedia has a new home: explore the independent tasting archive."
    />
    <title>Jitterpedia has moved</title>
    <style>
      body {
        margin: 0;
        background: #141019;
        color: #f5f2e9;
        font:
          18px/1.6 Arial,
          sans-serif;
      }
      main {
        max-width: 650px;
        margin: 10vh auto;
        padding: 24px;
      }
      img {
        width: 100%;
        height: auto;
      }
      a,
      button {
        color: #ddff36;
      }
      button {
        padding: 12px 16px;
        border: 1px solid #ddff36;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }
      a {
        display: inline-block;
        margin-top: 16px;
      }
      p {
        color: #c2b8c9;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../images/jitterpedia-wordmark.png" alt="Jitterpedia" />
      <h1>A new home for the collection.</h1>
      <p>Explore the new Jitterpedia and submit ratings for review.</p>
      <div id="legacy" hidden>
        <p id="legacy-message"></p>
        <button id="export" type="button">Download saved ratings</button>
        <p>
          Keep this export before moving to the new site. Your saved ratings stay in this browser
          and have not been submitted.
        </p>
      </div>
      <a href="https://jitterpedia.pogagnolo.chatgpt.site/">Open Jitterpedia ↗</a><br /><a
        href="../index.html"
        >← João Campagnolo</a
      >
    </main>
    <script>
      (() => {
        let pending = [];
        try {
          const stored = JSON.parse(localStorage.getItem("jitterpedia_pending") || "[]");
          if (Array.isArray(stored)) pending = stored;
        } catch {}
        if (!pending.length) {
          location.replace("https://jitterpedia.pogagnolo.chatgpt.site/");
          return;
        }
        document.getElementById("legacy").hidden = false;
        document.getElementById("legacy-message").textContent =
          "You have " + pending.length + " pending ratings saved here from the old site.";
        document.getElementById("export").addEventListener("click", () => {
          const cell = (v) => {
            let s = String(v ?? "");
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return '"' + s.replaceAll('"', '""') + '"';
          };
          const data =
            "brand,model,rater,score,product_link\r\n" +
            pending
              .map((r) => [r.brand, r.model, r.rater, r.score, r.product_link].map(cell).join(","))
              .join("\r\n");
          const url = URL.createObjectURL(
            new Blob(["\ufeff" + data], { type: "text/csv;charset=utf-8" }),
          );
          const a = document.createElement("a");
          a.href = url;
          a.download = "jitterpedia-pending.csv";
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        });
      })();
    </script>
  </body>
</html>
